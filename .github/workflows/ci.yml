name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      # Include stacked feature branches such as codex/audit-evidence-foundation.
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest tests/ translator/tests/ -q

      - name: Validate schemas and shipped artifacts
        run: |
          edgeloom validate auto_patch/capability-map.yaml -v
          edgeloom validate auto_patch/zigbee-lock/profiles translator/ha_proxy_edge_driver/profiles
          edgeloom validate tests/fixtures/catalog -v
          edgeloom audit auto_patch/capability-map.yaml \
            --schema schema/capability-map.schema.json \
            --schema-authority normative \
            --artifact-status stable \
            --output /tmp/capability-map.evidence.json
          edgeloom validate /tmp/capability-map.evidence.json --kind evidence-record

      # The shell entrypoint was unlinted for the whole life of the project,
      # which is how an `else:` typo survived in the backup guard.
      - name: Lint shell entrypoint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck auto_patch/auto_patch.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify the wheel installs and runs standalone
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/edgeloom --version
          # Schemas must resolve from inside the wheel, with no checkout present.
          cd /tmp
          /tmp/clean/bin/python -c "from edgeloom import schemas; [print(schemas.schema_path(kind)) for kind in schemas.KINDS]"
          printf '{"sample":true}\n' > artifact.json
          /tmp/clean/bin/edgeloom audit artifact.json --output record.json
          /tmp/clean/bin/edgeloom validate record.json --kind evidence-record
          /tmp/clean/bin/edgeloom validate "$GITHUB_WORKSPACE/tests/fixtures/catalog" -v

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Lint, link-check, and build the project site
        run: make site-check
