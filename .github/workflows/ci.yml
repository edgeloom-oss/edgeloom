name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      # Include stacked feature branches such as codex/audit-evidence-foundation.
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest tests/ translator/tests/ -q

      - name: Validate schemas and shipped artifacts
        run: |
          edgeloom validate auto_patch/capability-map.yaml -v
          edgeloom validate auto_patch/zigbee-lock/profiles translator/ha_proxy_edge_driver/profiles
          edgeloom validate tests/fixtures/catalog -v
          edgeloom audit auto_patch/capability-map.yaml \
            --schema schema/capability-map.schema.json \
            --schema-authority normative \
            --artifact-status stable \
            --output /tmp/capability-map.evidence.json
          edgeloom validate /tmp/capability-map.evidence.json --kind evidence-record

      # The shell entrypoint was unlinted for the whole life of the project,
      # which is how an `else:` typo survived in the backup guard.
      - name: Lint shell entrypoint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck auto_patch/auto_patch.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes -r requirements-release.txt
          python -m build --no-isolation
          python -m twine check dist/*
          version="$(python -c 'from edgeloom import __version__; print(__version__)')"
          python scripts/verify_release_dist.py \
            --dist-dir dist \
            --version "$version" \
            --write-manifest /tmp/edgeloom-SHA256SUMS
          python -c "import glob, tarfile; p=glob.glob('dist/*.tar.gz')[0]; names=tarfile.open(p).getnames(); assert any(n.endswith('/docs/catalog-contracts.md') for n in names)"
      - name: Verify the wheel installs and runs standalone
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/edgeloom --version
          # Schemas must resolve from inside the wheel, with no checkout present.
          cd /tmp
          /tmp/clean/bin/python -c "from edgeloom import schemas; expected=('profile','capability-map','evidence-record','source-manifest','catalog-mapping-set','catalog-device','catalog-corroboration'); assert schemas.KINDS == expected; [print(schemas.schema_path(kind)) for kind in expected]"
          /tmp/clean/bin/python -c "from importlib.resources import files; from edgeloom import catalog, catalog_site; assets=files('edgeloom').joinpath('catalog_assets'); [assets.joinpath(name).read_text() for name in ('page.html','index.html','device.html','styles.css','script.js')]"
          /tmp/clean/bin/edgeloom catalog --help
          printf '{"sample":true}\n' > artifact.json
          /tmp/clean/bin/edgeloom audit artifact.json --output record.json
          /tmp/clean/bin/edgeloom validate record.json --kind evidence-record
          /tmp/clean/bin/edgeloom validate "$GITHUB_WORKSPACE/tests/fixtures/catalog" -v

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Lint, link-check, and build the project site
        run: make site-check
