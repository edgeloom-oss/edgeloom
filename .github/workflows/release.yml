name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC). There is no API token stored
# in this repository and no secret to rotate: PyPI verifies the identity of this
# workflow directly. See https://docs.pypi.org/trusted-publishers/
on:
  release:
    types: [published]
  # Lets an existing release tag be pushed to PyPI manually if the automatic
  # publication needs to be retried.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        default: "v0.2.0"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable release tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be stable SemVer in vX.Y.Z form"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # For a release event this is the tag; for a manual run it is the
          # tag typed into the form. Building from the tag rather than a branch
          # guarantees the artifact matches what the release points at.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the built version matches the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          BUILT=$(python -c "
          import pathlib, re
          w = next(pathlib.Path('dist').glob('*.whl')).name
          print(re.match(r'edgeloom-([^-]+)-', w).group(1))
          ")
          echo "tag=$TAG built=$BUILT"
          if [ "v$BUILT" != "$TAG" ]; then
            echo "::error::built version $BUILT does not match tag $TAG"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match what is registered on PyPI as the
    # trusted publisher's environment.
    environment:
      name: pypi
      url: https://pypi.org/p/edgeloom
    # Mandatory for Trusted Publishing, and scoped to this job only so the
    # build steps above never see the OIDC token.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
